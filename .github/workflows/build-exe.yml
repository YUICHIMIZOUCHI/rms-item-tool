name: Build Windows EXE

on:
  workflow_dispatch:        # Actionsタブから手動実行できる
  push:
    tags: ["v*"]            # v1.0.0 などのタグをpushすると自動でリリース作成

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --name rms-item-tool
          --add-data "templates;templates"
          app.py

      - name: Upload artifact (手動実行時のダウンロード用)
        uses: actions/upload-artifact@v4
        with:
          name: rms-item-tool-windows
          path: dist/rms-item-tool.exe

      - name: Create Release (タグpush時のみ)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rms-item-tool.exe
          generate_release_notes: true
