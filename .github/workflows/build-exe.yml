name: Build Windows EXE

on:
  workflow_dispatch:        # Actionsタブから手動実行できる
  push:
    tags: ["v*"]            # v1.0.0 などのタグをpushすると自動でリリース作成

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # EXEのプロパティ（詳細タブ）に名前・バージョンを表示させる。
      # 素性のわからない実行ファイルに見えるとSmartScreenの警告が出やすいため。
      - name: Generate version info
        shell: python
        run: |
          import re, pathlib
          src = pathlib.Path("app.py").read_text(encoding="utf-8")
          ver = re.search(r'APP_VERSION\s*=\s*"([\d.]+)"', src).group(1)
          nums = (list(map(int, ver.split("."))) + [0, 0, 0, 0])[:4]
          pathlib.Path("version_info.txt").write_text(f'''VSVersionInfo(
            ffi=FixedFileInfo(
              filevers={tuple(nums)}, prodvers={tuple(nums)},
              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('041104b0', [
                StringStruct('FileDescription', 'RMS商品一括編集ツール'),
                StringStruct('FileVersion', '{ver}'),
                StringStruct('InternalName', 'rms-item-tool'),
                StringStruct('LegalCopyright', 'MIT License'),
                StringStruct('OriginalFilename', 'rms-item-tool.exe'),
                StringStruct('ProductName', 'RMS商品一括編集ツール'),
                StringStruct('ProductVersion', '{ver}'),
              ])]),
              VarFileInfo([VarStruct('Translation', [0x0411, 1200])])
            ]
          )
          ''', encoding="utf-8")
          print("version:", ver)

      # --noconsole: 黒いコンソール画面を出さず、アプリのように起動させる。
      #   stdout/stderr が None になるため app.py 側で起動ログ.txt に振り向けている。
      #   終了はブラウザ画面右上の［終了］ボタン（/api/shutdown）で行う。
      - name: Build EXE
        run: >
          pyinstaller --onefile --noconsole
          --name rms-item-tool
          --icon app.ico
          --version-file version_info.txt
          --add-data "templates;templates"
          --add-data "app.ico;."
          app.py

      - name: Upload artifact (手動実行時のダウンロード用)
        uses: actions/upload-artifact@v4
        with:
          name: rms-item-tool-windows
          path: dist/rms-item-tool.exe

      - name: Create Release (タグpush時のみ)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rms-item-tool.exe
          generate_release_notes: true
